name: Go SDK CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.22"
      - run: go build ./...
      - run: go vet ./...
      # Verification only, never auto-fix: the SDK is generated gofmt-clean, so a listed file means
      # either hand-edited custom code or a regenerate that was not committed. `gofmt -l` exits 0
      # even when it lists files, so the output itself is the assertion.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would reformat:"; echo "$unformatted"; exit 1
          fi
